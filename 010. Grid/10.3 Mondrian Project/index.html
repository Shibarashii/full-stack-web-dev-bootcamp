<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mondrian Project</title>
  <style>
    /* 
    Write your CSS here 
    Gap Colour: #000
    White: #F0F1EC
    Red: #E72F24
    Black: #232629
    Blue: #004592
    Yellow: #F9D01E
    For dimensions, see dimensions.png image.
    HINT: Remember you can't change the properties of grid lines.
    But grid lines are transparent!
    */
    .flex-container {
      display: flex;
      align-items: center;
      justify-self: center;
      height: 100vh;
    }

    .grid-container {
      display: grid;
      background-color: #000;
      width: 748px;
      height: 746px;
      gap: 9px;
      grid-template-columns: 320px 198px 153px 50px;
      grid-template-rows: 414px 130px 155px 20px;
    }

    .white {
      background-color: #F0F1EC;
    }

    .red {
      background-color: #E72F24;
    }

    .black {
      background-color: #232629;
    }

    .blue {
      background-color: #004592;
    }

    .yellow {
      background-color: #F9D01E;
    }

    #box-2 {
      grid-column: span 3;
    }

    #box-3 {
      grid-row: span 2;
    }

    #box-4 {
      grid-row: span 2;
      grid-column: span 2;
    }

    #box-6 {
      grid-row: span 2;
    }
  </style>
</head>

<body>
  <!-- Write your HTML here -->
  <main class="flex-container">
    <div class="grid-container">
      <!-- Row 1 -->
      <div class="box red" id="box-1"></div>
      <div class="box white" id="box-2"></div>

      <!-- Row 2 -->
      <div class="box white" id="box-3"></div>
      <div class="box white" id="box-4"></div>
      <div class="box blue" id="box-5"></div>

      <!-- Row 3 -->
      <div class="box white" id="box-6"></div>

      <!-- Row 4-->
      <div class="box white" id="box-7"></div>
      <div class="box yellow" id="box-8"></div>
      <div class="box black" id="box-9"></div>


    </div>
  </main>
</body>

</html>
